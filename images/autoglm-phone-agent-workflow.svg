  <line x1="741" y1="302" x2="932" y2="302" stroke="#d5deda" stroke-width="2"/><text x="741" y="344" fill="#172126" font-family="Arial,sans-serif" font-size="20">Camera</text><rect x="890" y="322" width="43" height="25" rx="13" fill="#17646d"/><circle cx="919" cy="335" r="9" fill="#fff"/>
  <line x1="741" y1="374" x2="932" y2="374" stroke="#d5deda" stroke-width="2"/><text x="741" y="416" fill="#172126" font-family="Arial,sans-serif" font-size="20">Location</text><rect x="890" y="394" width="43" height="25" rx="13" fill="#cdd8d1"/><circle cx="903" cy="407" r="9" fill="#fff"/>
  <line x1="741" y1="446" x2="932" y2="446" stroke="#d5deda" stroke-width="2"/><text x="741" y="488" fill="#172126" font-family="Arial,sans-serif" font-size="20">Microphone</text><rect x="890" y="466" width="43" height="25" rx="13" fill="#cdd8d1"/><circle cx="903" cy="479" r="9" fill="#fff"/>
  <rect x="1014" y="318" width="118" height="148" rx="5" fill="#fff8e9" stroke="#c28a27" stroke-width="2"/><text x="1037" y="355" fill="#8d6216" font-family="monospace" font-size="16">CHECKPOINT</text><text x="1037" y="390" fill="#172126" font-family="Arial,sans-serif" font-size="18" font-weight="700">Approval</text><text x="1037" y="417" fill="#172126" font-family="Arial,sans-serif" font-size="18" font-weight="700">required</text><path d="M1014 392 L984 392" stroke="#c28a27" stroke-width="3"/>
